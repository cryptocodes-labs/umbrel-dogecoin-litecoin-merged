name: Publish images

# No `paths:` filter on purpose. Configuring the store touches umbrel-app.yml
# rather than images/, and a publish that silently does not run is worse than a
# rebuild that was not strictly needed — the layer cache makes the latter cheap.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# Least privilege for every job: read the repository, nothing else. A job that
# needs more says so itself (publishing images needs packages: write).
permissions:
  contents: read

jobs:
  # An unconfigured store — placeholder URLs, or images still pointing at a
  # local registry — must never be published. This is the gate, so it does NOT
  # get continue-on-error.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Refuse to publish an unconfigured store
        run: python3 test/validate_manifest.py --strict

  build:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The tag must change whenever the image content changes. Republishing
          # the same tag mutates it in place, so umbrelOS can pull the OLD
          # digest for a NEW app version and report a successful update that
          # changed nothing.
          - name: umbrel-dogecoin-core
            context: images/core
            tag: "1.14.9-2"
          # 1.1.0 is the first dashboard build whose branding comes from the
          # environment, which is what lets the Litecoin app reuse it. 1.1.1
          # stops trusting a credentials host name that answers with more than
          # one address; every node app, the Dogecoin one included, uses it.
          - name: umbrel-dogecoin-ui
            context: images/ui
            tag: "1.1.1"
          - name: umbrel-litecoin-core
            context: images/ltc-core
            tag: "0.21.5.8-2"
          - name: umbrel-pepecoin-core
            context: images/pep-core
            tag: "1.1.0-2"
          - name: umbrel-soqucoin-core
            context: images/soq-core
            tag: "2.6.1-1"
          - name: umbrel-dogecoin-stratum
            context: images/stratum
            tag: "1.9.3"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # A published version is never rebuilt. Every push to main used to build
      # and push every image again under its existing tag, so the image behind
      # a version changed whenever Debian moved a package — while the compose
      # files pin each image by digest, and an app installed later must get
      # exactly the bytes that were tested. A change ships under a new tag.
      - name: Is this version already published?
        id: published
        run: |
          ref="${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.name }}:${{ matrix.tag }}"
          if docker buildx imagetools inspect "${ref}" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${ref} is already published and is left exactly as it is. Raise the tag to publish a change."
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.published.outputs.value != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.name }}:${{ matrix.tag }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.name }}:latest
          # This label LINKS the package to the repository. It does NOT make it
          # public: GitHub creates every new package private regardless, and a
          # package inherits the repository's permissions but not its
          # visibility. umbrelOS pulls anonymously, so after the first run of
          # this workflow each NEW package must be switched to Public by hand at
          # https://github.com/<owner>?tab=packages — otherwise the app install
          # fails on the image pull.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # GitHub Actions only interpolates ${{ }}, so a bare {{ }} Go template is
      # passed through to docker untouched.
      - name: Show the digest to pin
        run: |
          echo "The digest docker-compose.yml must pin for this tag:"
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.name }}:${{ matrix.tag }}" \
            --format '{{.Manifest.Digest}}'

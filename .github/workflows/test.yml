name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for every job: read the repository, nothing else. A job that
# needs more says so itself (publishing images needs packages: write).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # ubuntu-latest ships an externally-managed Python (PEP 668), so a bare
      # `pip install` fails. setup-python gives us an interpreter we own.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Cache the Dogecoin Core release tarball
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/dogecoin-*.tar.gz
          key: dogecoin-core-1.14.9-${{ runner.arch }}

      - name: Cache the Pepecoin Core release tarball
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/pepecoin-*.tar.gz
          key: pepecoin-core-1.1.0-${{ runner.arch }}

      - name: Cache the Litecoin Core release tarball
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/litecoin-*.tar.gz
          key: litecoin-core-0.21.5.8-${{ runner.arch }}

      - name: Entrypoint and config-generation suite
        run: bash ./test/entrypoint.sh

      - name: Litecoin entrypoint and config-generation suite
        run: bash ./test/ltc_entrypoint.sh

      # The Soqucoin Node's config: wallet off, mining RPCs on, password only
      # as an rpcauth HMAC, private RPC ranges, uid 1000 — then a real
      # soqucoind (the pinned release) started on it.
      - name: Soqucoin entrypoint and config-generation suite
        run: bash ./test/soq_entrypoint.sh

      - name: Solo app .env loader suite
        run: bash ./test/solo_exports.sh

      # The suites that need no daemon. The rest of test/ needs a regtest
      # dogecoind and a regtest litecoind and runs on the maintainer machine.
      # These cover address and block-serialisation bytes, the merged template
      # ordering guard, the MWEB tail, the on-disk statistics format and its v1
      # migration, and the Web Push signing — all pure functions of their
      # input, and all previously covered by nothing at all in CI.
      - name: Unit suite
        run: node test/unit.js DU4KTk97aC46ZbXjdTpP9tFNYCrmuLZXLd ""

      - name: Merged template ordering
        run: node test/merged_ordering.js

      - name: Public merged mining, pure functions
        run: node test/public_unit.js

      - name: Several aux chains under one parent (chain merkle tree)
        run: node test/multi_aux_unit.js

      # Soqucoin as a third aux chain: its Bech32m addresses, the four-leaf
      # chain tree, and that it only ever runs on the private merged port.
      - name: Soqucoin unit checks
        run: node test/soq_unit.js

      # PEER_POOLS: the other pool containers' figures, read over the internal
      # network and added up for the umbrelOS widgets; hostile answers refused.
      - name: Other ports on the dashboard and widgets
        run: node test/peers_http.js

      # The node dashboard's RPC password goes only to the app proxy, and not
      # to a host name another container also answers to.
      - name: Node dashboard credentials gate
        run: node test/ui_credentials.js

      - name: Which workers mine Pepecoin, per the status snapshot
        run: node test/pep_snapshot_unit.js

      - name: Every miner's averages over an hour, a day and a week
        run: node test/miner_averages.js

      - name: Node alarm state machine
        run: node test/health.js

      - name: Aux longpoll and the moved-tip window
        run: node test/aux_longpoll.js

      - name: Statistics reset
        run: node test/reset.js

      # A real Pool, started against mock nodes. Covers the wiring the unit
      # suites cannot: that start() actually launches the aux longpoll, that a
      # Dogecoin tip move reaches the miners in milliseconds, and that the loop
      # gives itself up rather than tie up the node's RPC threads.
      - name: Pool wiring
        run: node test/pool_wiring.js

      # The healthcheck against a pool that is actually running — the headline
      # claim of this release, and the one no other suite can reach.
      - name: Live healthcheck
        run: node test/health_live.js

      # Starts a real server against an RPC port nothing is listening on: the
      # case where the pool never comes up at all, which is the one the alarm
      # exists for and the one no in-pool check could ever see.
      - name: Alarm HTTP surface
        run: node test/health_http.js

      # Proof that the suites above fail when the code is wrong. Two tests in
      # this repo were once vacuous; this is what stops that from being found
      # by accident again.
      - name: Mutation testing
        run: bash ./test/mutants.sh

      - name: MWEB block serialisation
        run: node test/mweb_serialisation.js

      - name: Statistics persistence and v1 migration
        run: |
          node test/persistence.js
          node test/migration.js

      - name: Web Push suite
        run: node test/push.js

      - name: Manifest validation
        run: python3 test/validate_manifest.py

      # Every image an app uses is pinned by digest, and the registry serves
      # exactly that digest for the tag: an app installed later gets the bytes
      # that were tested, and a re-pushed tag fails here instead of changing
      # quietly on an Umbrel.
      - name: Image digests match the registry
        run: bash ./test/image_pins.sh

      # Against a real dogecoind, because the claims the aux longpoll rests on
      # are claims about Dogecoin Core, not about our code: that a
      # getblocktemplate longpoll wakes on a tip change, that createauxblock
      # caches until then, and that submitauxblock answers "block hash unknown"
      # for the aux block it has just discarded. Reuses the cached tarball the
      # integration suite already downloads.
      - name: Aux longpoll against a real dogecoind
        run: bash ./test/aux_longpoll_regtest.sh

      - name: Integration suite
        run: bash ./test/integration.sh

      # The one merged-mining claim that only the daemons can settle: a Dogecoin
      # block committed into a Litecoin parent built by our code is accepted by
      # dogecoind AND litecoind. Runs the exact releases the images pin, so a
      # node upgrade is tested here before it ships.
      - name: Merged mining against real litecoind and dogecoind
        run: bash ./test/merged_regtest.sh

  # Every node image run exactly as its umbrelOS app runs it — read-only,
  # tmpfs /tmp, pids limit, minimal capabilities, healthcheck as the daemon's
  # user — on regtest. Proves the hardening does not stop a node from starting.
  hardened:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Node images under the hardened profile
        run: bash ./test/hardened_containers.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint the node Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: images/core/Dockerfile
          failure-threshold: error

      - name: Lint the Litecoin node Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: images/ltc-core/Dockerfile
          failure-threshold: error

      - name: Lint the Pepecoin node Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: images/pep-core/Dockerfile
          failure-threshold: error

      - name: Lint the Soqucoin node Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: images/soq-core/Dockerfile
          failure-threshold: error

      - name: Lint the dashboard Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: images/ui/Dockerfile
          failure-threshold: error

      - name: Shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --severity=warning \
            images/core/entrypoint.sh \
            images/core/healthcheck.sh \
            images/ltc-core/entrypoint.sh \
            images/ltc-core/healthcheck.sh \
            images/pep-core/entrypoint.sh \
            images/pep-core/healthcheck.sh \
            images/soq-core/entrypoint.sh \
            images/soq-core/healthcheck.sh \
            doge-dogecoin-node/exports.sh \
            doge-dogecoin-solo/exports.sh \
            doge-litecoin-node/exports.sh \
            doge-pepecoin-node/exports.sh \
            doge-soqucoin-node/exports.sh \
            scripts/*.sh \
            test/*.sh

  build:
    # Proves the images actually build for both architectures on every change,
    # without publishing anything. A multi-platform build with no exporter runs
    # every stage for both platforms and discards the result.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build dogecoind (amd64 + arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: images/core
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=core
          cache-to: type=gha,mode=max,scope=core
      - name: Build litecoind (amd64 + arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: images/ltc-core
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=ltc-core
          cache-to: type=gha,mode=max,scope=ltc-core
      - name: Build pepecoind (amd64 + arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: images/pep-core
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=pep-core
          cache-to: type=gha,mode=max,scope=pep-core
      - name: Build soqucoind (amd64 + arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: images/soq-core
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=soq-core
          cache-to: type=gha,mode=max,scope=soq-core
      - name: Build the stratum server (amd64 + arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: images/stratum
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=stratum
          cache-to: type=gha,mode=max,scope=stratum
      - name: Build the dashboard (amd64 + arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: images/ui
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

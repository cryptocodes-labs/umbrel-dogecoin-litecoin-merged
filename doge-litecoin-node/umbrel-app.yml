manifestVersion: 1
id: doge-litecoin-node
category: bitcoin
name: Litecoin Node
version: "0.21.5.8-2"
tagline: Run your own Litecoin full node, powered by Litecoin Core
description: >-
  Run a full Litecoin node on your Umbrel, powered by the official Litecoin Core release binaries.


  Your node independently downloads and validates every Litecoin block and transaction, so you never have
  to trust somebody else's server to tell you what happened on the network. Point your wallet at your own
  node and no third party gets to see which addresses are yours.


  Litecoin is also the parent chain for Dogecoin's merge mining: a Dogecoin miner needs a Litecoin block
  template, and this app is a good place to get one from — your own node, on your own machine, instead of
  a public RPC endpoint that can watch or throttle you. Note that Litecoin Core wants getblocktemplate to
  be called with the rule set ["mweb", "segwit"]; a miner that omits either is refused.


  The dashboard shows sync progress, connected peers, mempool, network hashrate and the RPC credentials
  that wallets and other apps need. JSON-RPC and P2P are available to other Umbrel apps and to your local
  network. Outbound connections can optionally be routed through Umbrel's Tor proxy.


  The wallet is disabled by default — this is a validating node, and every wallet function that isn't
  exposed is one that can't be abused. It can be turned back on; settings live in the compose file, and
  your own litecoin.conf lines go in litecoin-custom.conf, which the app merges in on every start.


  Runs pruned to about 10 GB of block data by default, plus a few GB of chainstate, so reserve around
  15 GB. Pruning only discards old blocks — the UTXO set that validation and mining actually need is
  always kept in full. The initial sync still downloads the whole chain over the network, well over
  100 GB, and takes anywhere from several hours to a couple of days depending on your disk and
  connection. Change PRUNE in the compose file for a full archival node.
developer: Litecoin Core developers
website: https://litecoin.org
dependencies: []
repo: https://github.com/cryptocodes-labs/umbrel-dogecoin-litecoin-merged
support: https://github.com/cryptocodes-labs/umbrel-dogecoin-litecoin-merged/issues
port: 9330
icon: https://raw.githubusercontent.com/cryptocodes-labs/umbrel-dogecoin-litecoin-merged/main/doge-litecoin-node/icon.svg
gallery:
  - https://raw.githubusercontent.com/cryptocodes-labs/umbrel-dogecoin-litecoin-merged/main/doge-litecoin-node/gallery/1.jpg
  - https://raw.githubusercontent.com/cryptocodes-labs/umbrel-dogecoin-litecoin-merged/main/doge-litecoin-node/gallery/2.jpg
  - https://raw.githubusercontent.com/cryptocodes-labs/umbrel-dogecoin-litecoin-merged/main/doge-litecoin-node/gallery/3.jpg
path: ""
defaultPassword: ""
deterministicPassword: false
torOnly: false
installSize: 15000000000
releaseNotes: >-
  Security hardening, no change to the node itself (Litecoin Core 0.21.5.8). The container runs with a
  read-only image, a process limit and its healthcheck as the litecoin user; the startup script no
  longer follows symlinks in the data folder, refuses newlines in the settings that become config
  lines, and keeps the RPC password out of the daemon's environment. The dashboard no longer shows the
  RPC password to a host name that answers with more than one address.
widgets:
  - id: "sync"
    type: "text-with-progress"
    refresh: "5s"
    endpoint: "app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "Blockchain sync"
      text: "83%"
      progressLabel: "In progress"
      progress: 0.83
  - id: "stats"
    type: "four-stats"
    refresh: "10s"
    endpoint: "app:3000/api/widget/stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Connections"
          text: "24"
          subtext: "peers"
        - title: "Mempool"
          text: "18"
          subtext: "txs"
        - title: "Hashrate"
          text: "1.1"
          subtext: "PH/s"
        - title: "Blockchain size"
          text: "11"
          subtext: "GB"
backupIgnore:
  - data/.litecoin/blocks
  - data/.litecoin/chainstate
  - data/.litecoin/indexes
  - data/.litecoin/testnet4
  - data/.litecoin/regtest
  - data/.litecoin/debug.log
submitter: Andreas
submission: https://github.com/cryptocodes-labs/umbrel-dogecoin-litecoin-merged

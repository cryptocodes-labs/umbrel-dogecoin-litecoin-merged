manifestVersion: 1
id: doge-dogecoin-node
category: bitcoin
name: Dogecoin Node
version: "1.14.9-2"
tagline: Run your own Dogecoin full node, powered by Dogecoin Core
description: >-
  Run a full Dogecoin node on your Umbrel, powered by the official Dogecoin Core release binaries.


  Your node independently downloads and validates every Dogecoin block and transaction, so you never have
  to trust somebody else's server to tell you what happened on the network. Point your wallet at your own
  node and no third party gets to see which addresses are yours.


  Running a node also strengthens the Dogecoin network: you relay blocks and transactions to other peers
  and help keep it decentralised.


  The dashboard shows sync progress, connected peers, mempool, network hashrate and the RPC credentials
  that wallets and other apps need. JSON-RPC and P2P are available to other Umbrel apps and to your local
  network. Outbound connections can optionally be routed through Umbrel's Tor proxy.


  The wallet is disabled by default — this is a validating node, and every wallet function that isn't
  exposed is one that can't be abused. It can be turned back on; the README explains where settings
  live and why editing the running copy does not stick.


  Runs pruned by default: about 20 GB of block data plus roughly 13 GB of chainstate, so reserve around
  35 GB. Pruning only discards old blocks — the UTXO set is always kept in full. The initial sync still
  downloads the entire chain over the network, close to 190 GB, and takes anywhere from a day to a few
  days depending on your disk and connection. Change PRUNE in the compose file for a full archival node.
  Much node. Very decentralised.
developer: Dogecoin Core developers
website: https://dogecoin.com
dependencies: []
repo: https://github.com/cryptocodes-labs/umbrel-dogecoin-litecoin-merged
support: https://github.com/cryptocodes-labs/umbrel-dogecoin-litecoin-merged/issues
port: 22550
icon: https://raw.githubusercontent.com/cryptocodes-labs/umbrel-dogecoin-litecoin-merged/main/doge-dogecoin-node/icon.svg
gallery:
  - https://raw.githubusercontent.com/cryptocodes-labs/umbrel-dogecoin-litecoin-merged/main/doge-dogecoin-node/gallery/1.jpg
  - https://raw.githubusercontent.com/cryptocodes-labs/umbrel-dogecoin-litecoin-merged/main/doge-dogecoin-node/gallery/2.jpg
  - https://raw.githubusercontent.com/cryptocodes-labs/umbrel-dogecoin-litecoin-merged/main/doge-dogecoin-node/gallery/3.jpg
path: ""
defaultPassword: ""
deterministicPassword: false
torOnly: false
installSize: 36000000000
releaseNotes: >-
  Maintenance release, Dogecoin Core unchanged (1.14.9). The node and dashboard images now come
  from ghcr.io/cryptocodes-labs, where this app store's images moved; the old
  ghcr.io/andreashetem-cloud address no longer exists, so a reinstall or a restore from backup of
  the previous version could not download its images. Your chain data and settings are kept.


  Raises the node's RPC threads and work queue above Dogecoin Core's defaults of 4 and 16. A single
  getblocktemplate longpoll — which mining software holds open until the next block — occupies one of
  those four threads, and everything else then starts failing with "Work queue depth exceeded".
  Also lowers the default UTXO cache to 1000 MB, which is ample once the initial sync is done, and
  corrects the disk figures in this listing.
widgets:
  - id: "sync"
    type: "text-with-progress"
    refresh: "5s"
    endpoint: "app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "Blockchain sync"
      text: "83%"
      progressLabel: "In progress"
      progress: 0.83
  - id: "stats"
    type: "four-stats"
    refresh: "10s"
    endpoint: "app:3000/api/widget/stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Connections"
          text: "24"
          subtext: "peers"
        - title: "Mempool"
          text: "18"
          subtext: "txs"
        - title: "Hashrate"
          text: "1.4"
          subtext: "PH/s"
        - title: "Blockchain size"
          text: "142"
          subtext: "GB"
backupIgnore:
  - data/.dogecoin/blocks
  - data/.dogecoin/chainstate
  - data/.dogecoin/indexes
  - data/.dogecoin/testnet3
  - data/.dogecoin/regtest
  - data/.dogecoin/debug.log
submitter: Andreas
submission: https://github.com/cryptocodes-labs/umbrel-dogecoin-litecoin-merged

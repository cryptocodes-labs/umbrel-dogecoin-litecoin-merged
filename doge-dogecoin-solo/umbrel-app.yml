torOnly: false
installSize: 200000000
releaseNotes: >-
  Soqucoin (SOQ) can be merge-mined as a third aux chain beside Dogecoin and Pepecoin, on the private
  merged port only: set SOQ_RPC_HOST and SOQ_PAYOUT_ADDRESS (an sq1p… address) in .env and install the
  Soqucoin Node app. soqucoind builds each Soqucoin block itself with createauxblock. Without those two
  settings, or while the Soqucoin node is away, mining is exactly what it was. The dashboard and widgets
  now give the distance to a block per coin (LTC, DOGE, PEP, SOQ), and with PEER_POOLS set they also
  read the public and rented LTC + DOGE ports on this Umbrel, so every port shows up here.


  Optional Pepecoin merge mining, beside Dogecoin, under the same Litecoin work. Set PEP_RPC_HOST
  (your Pepecoin Node, e.g. doge-pepecoin-node_pepecoind_1), PEP_RPC_PASSWORD and
  PEP_PAYOUT_ADDRESS in .env to turn it on; without them nothing changes. Pepecoin can never stop
  or slow the pool: while its node is down or syncing, jobs carry Litecoin and Dogecoin only. In
  public mode miners opt in with LTC.DOGE.PEP[.rig] and are paid 99% of their own Pepecoin blocks.


  Adds an optional public mode for merged mining (PUBLIC_MERGED=1), for running a port that
  other people mine on, each paid at their own addresses. It runs as a separate container of
  the same image next to this app and is off unless you turn it on: with PUBLIC_MERGED unset,
  your own pool builds exactly the same coinbase as before, byte for byte. Miners use the
  username <LTC address>.<DOGE address>[.rig]; the pool builds each miner's Dogecoin block
  itself from getblocktemplate, paying 99% to the miner and POOL_FEE_PERCENT to you, and splits
  the Litecoin coinbase the same way. See the README section "A public port".


  The Mining profile section stayed silent about the rented port in one case: when
  MINING_PROFILE was fixed in .env, the "Fixed at ..." message never mentioned a
  configured RENTED_STRATUM_PORT, even though that port was running fine. It now
  says so and gives the port number, the same way the unlocked view already did.


  Your own miners and a rented order can now run at the same time. RENTED_STRATUM_PORT opens a
  second, dedicated stratum port that always runs the rented profile's numbers, alongside the
  main one running whatever MINING_PROFILE says. Before this release the mining profile was one
  port switched between two regimes, so switching to "rented" for an order re-difficultied every
  home ASIC still connected to the same port — it did not disconnect, it just stopped finding
  shares, which looked exactly like the miner breaking the moment hashpower was rented. Now
  each port keeps its own connection ceilings, message-rate limits and difficulty bounds,
  enforced separately, and a live switch of the main port's profile — the dashboard control
  from the previous release — reaches workers already connected on that port without ever
  touching the dedicated one. Requires LOCK_PAYOUT_ADDRESS=1, exactly like MINING_PROFILE=
  rented, and is meant to be forwarded on your router only while an order is running. The
  worker table now labels which port each connection came in on, and the dashboard shows a
  second connect URL whenever this port is configured — including when it was configured but
  failed to bind, which used to look identical to never having set it at all.


  This app's port footprint grows by one either way: Docker Compose cannot publish a port
  only conditionally, so 22558 is now claimed on every device from this version onward,
  whether or not RENTED_STRATUM_PORT is ever set — the same way 22557 always has been even
  for an operator who never rents hashpower. If something else on your device already uses
  22558, set RENTED_STRATUM_PORT in .env to a free port before updating.


  The mining profile can now be switched from the dashboard — no SSH, no editing .env, no
  restart. A "home" / "rented" control under a new Mining profile section applies instantly,
  to workers already connected as well as new ones, because it mutates the running pool's
  configuration directly rather than requiring a fresh process. The choice is written to the
  app's data directory, so it survives a restart or an update the same way settings in .env
  do. Switching to "rented" is refused, live, by the same interlock that already guarded it
  at startup: LOCK_PAYOUT_ADDRESS=1 must be set in .env first, because that profile assumes
  the stratum port is open to the internet. The control goes read-only, and says so, whenever
  MINING_PROFILE is set explicitly in .env — an operator who fixed it there meant to fix it.


  This app can now tell you when it has stopped mining. After an umbrelOS restart both node
  apps stayed down, this app kept answering its own healthcheck — which only ever checked its
  own web server — and thirteen hours passed with nothing mined and nothing said. The
  dashboard now shows a red bar naming the node that is unreachable and how long it has been,
  any subscribed phone is notified once when it happens and once when it recovers, and the
  container healthcheck actually fails. It works even when the pool never started at all,
  which is exactly the case that went unnoticed: with the Dogecoin node down, merged mining
  deliberately refuses to start, so anything watching from inside the pool would never have
  run. A last resort restarts the process after a stall that no node is reporting an error
  for — never during a real outage, where restarting cannot switch a node app back on, and
  never while a block is being submitted.


  Dogecoin's tip is now followed rather than polled. dogecoind has no longpoll for
  createauxblock, but it has one for getblocktemplate, and the moment its tip moves is all
  that is needed: AuxMiningCreateBlock clears its map of issued aux blocks on every tip
  change, and submitauxblock then answers "block hash unknown". At a two second poll that
  left about one second of every sixty second Dogecoin block being hashed against work that
  could no longer be handed in. That window is now a round trip. A proof that arrives too
  late is no longer retried for a hundred seconds against a certainty, and is counted so the
  gain is measurable rather than asserted.


  The share counters can be reset from the dashboard. A day of changing miner settings leaves
  a reject rate that hides everything that happens afterwards. Blocks found are never
  cleared, and neither is the cumulative work each miner has done — that is the denominator
  of the luck figure, and zeroing it while keeping the block count would leave the dashboard
  reading "1 block found, 8.0e+10% luck". The app is also renamed and its icon now carries
  both coins, because "Dogecoin + Litecoin Solo Mining" was shown truncated on the umbrelOS
  home screen and its icon was indistinguishable from the Dogecoin node app's.


  Three independent reviews of the above found, and this release fixes: an aborted longpoll
  leaving a worker thread parked inside dogecoind until its tip moves — measured on a real
  node, where the fourth one made submitauxblock time out too, so the loop now backs off hard
  and gives itself up rather than tie up a node that has eight threads; a node-down push
  being rendered as a repeat of the last block notification for ten minutes after any block,
  and then not repeated for six hours; every duration being measured on a wall clock that
  steps by hours when NTP corrects an Umbrel after boot, which could both fire a false alarm
  during a legitimately slow start and announce a recovery that never happened; a flapping
  node buzzing a phone thirty times an hour; and a merged pool that answered its nodes
  perfectly but could not turn their templates into a job — miners left on stale work behind
  a green dashboard, indefinitely, because "a template arrived" was recorded before the job
  was built. Each fix carries a test, and each test carries a mutant that proves it fails
  when the fix is removed.


  Fixes found by an independent review of the 1.3.1 and 1.3.2 changes. A template answer that
  arrived out of order could put every miner back on an already-orphaned Litecoin block, silently,
  with the dashboard still green — the faster poll made that race more likely rather than less, so
  refreshes are now serialised and a result that would move either chain backwards is dropped. Job
  history doubled to keep covering ten minutes at the new poll rate, so late work from a proxy is
  still judged instead of refused unhashed. The merged badge no longer keeps asserting DOGE + LTC
  when the dashboard has lost contact or the app has refused to start, and it says LTC only while
  the Dogecoin node is unreachable. An unreadable .env is treated as absent instead of aborting the
  app start, a trailing space no longer silently turns merged mining off, and a poll interval of 0
  can no longer flood the node. CI now runs the unit, MWEB, persistence, migration, push and
  manifest suites, which it previously ran none of.


  The Dogecoin side of merged mining now refreshes every 2 seconds instead of every 5.
  Merged mining longpolls Litecoin, because the parent tip is what invalidates the header
  miners are hashing, and dogecoind offers no longpoll on createauxblock — so the Dogecoin
  tip is caught by polling alone, and the gap between a new Dogecoin block and the next
  poll is time spent on an aux block that would be rejected if found. At 60 second blocks
  that was about 4% of the Dogecoin half; it is now under 2%. Settable as
  POLL_INTERVAL_SECONDS in .env.


  Settings now survive an app update. Everything device-specific — the payout addresses,
  the merged-mining switch, the Litecoin RPC password, the mining profile — is read from
  .env in the app's data directory instead of from docker-compose.yml, which umbrelOS
  regenerates from the app store on every update. Before this, updating the app quietly
  turned merged mining back off. The dashboard also carries a MERGED · DOGE + LTC badge
  whenever merged mining is on, so which mode you are in is visible at a glance rather
  than inferred from the log.


  Merged mining. With the Litecoin Node app installed, the same hashes can now win on
  BOTH chains: your miners hash Litecoin headers carrying a commitment to a Dogecoin block,
  which is how Dogecoin has been mined since 2014. A share meeting Litecoin's target becomes
  a Litecoin block, one meeting Dogecoin's becomes a Dogecoin block, and neither costs the
  other anything. Off by default; the Dogecoin-only path is unchanged.


  Renting hashpower is now one setting. MINING_PROFILE switches every limit at
  once between your own miners and a NiceHash-style order, because a rented order
  is thousands of times faster and the home limits would disconnect it as a flood
  within a second. The app refuses to start in the rented profile unless the payout
  address is locked, since renting means the stratum port is open to the internet
  and an unlocked payout pays whoever asks.


  Every worker now has its own page: tap one in the table to see its own hashrate chart over the last
  day, its best share, how much work it has done, and why any of its shares were rejected. Best share
  and difficulty are shown per device, and on a phone they appear under the worker's name instead of
  being hidden with the columns that do not fit.


  Round-trip time is now measured during the handshake, so miners whose firmware ignores
  client.get_version finally report a latency instead of a dash. A warning appears as soon as a miner
  stops submitting or drops far below its own 24-hour average, so a dead hashboard is visible without
  watching the page. Optional push notifications will tell you about a block with the screen off,
  over an https address.


  Fixes: a malformed HTTP request could stop the app, which would have cost a block that was being
  submitted at that moment; the app is now given time to finish submitting during an update instead of
  being killed after ten seconds; and a wrong system clock at boot can no longer freeze or erase the
  hashrate history.


  Statistics now survive a restart: shares, best share, hashrate history and blocks found are kept on
  disk instead of only in memory. Adds hashrate charts over hours and months, the odds of a block over
  a day, month and year, a luck figure comparing shares found against shares expected, round-trip
  latency to each miner and to your node, and an unmistakable state when a block is found.


  First release. Stratum v1 with per-worker variable difficulty, block templates over getblocktemplate
  longpoll for instant new-block switching, per-worker payout addresses, and a dashboard showing
  hashrate, best share and expected time to a block. Block construction is verified against a real
  Dogecoin Core node in the test suite.
widgets:
  - id: "hashrate"
    type: "text-with-progress"
    refresh: "10s"
    endpoint: "app:3000/api/widget/hashrate"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "Solo hashrate"
      text: "83.4 MH/s"
      progressLabel: "best share 7.9%"
      progress: 0.79
  - id: "stats"
    type: "four-stats"
    refresh: "10s"
    endpoint: "app:3000/api/widget/stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "83.4"
          subtext: "MH/s"
        - title: "Workers"
          text: "2"
          subtext: "connected"
        - title: "Best share"
          text: "412k"
          subtext: "difficulty"
        - title: "Blocks"
          text: "0"
          subtext: "found"
